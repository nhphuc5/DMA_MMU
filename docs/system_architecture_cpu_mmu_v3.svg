<svg xmlns="http://www.w3.org/2000/svg" width="1900" height="1120" viewBox="0 0 1900 1120">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#222"/>
    </marker>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#1769d1"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#17823b"/>
    </marker>
    <marker id="arrow-orange" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#d66a00"/>
    </marker>
    <style>
      .title { font: 700 36px Arial, sans-serif; fill: #14213d; }
      .section { font: 700 24px Arial, sans-serif; fill: #14213d; }
      .head { font: 700 19px Arial, sans-serif; fill: #152238; }
      .label { font: 16px Arial, sans-serif; fill: #1e293b; }
      .small { font: 14px Arial, sans-serif; fill: #334155; }
      .bus { font: 700 15px Arial, sans-serif; }
      .box { stroke: #20344f; stroke-width: 2; rx: 8; }
      .control { fill: #e7f1ff; }
      .translation { fill: #fff3d4; }
      .dma { fill: #eaf7ea; }
      .memory { fill: #f4f5f7; }
      .group { fill: #fbfdfb; stroke: #31513a; stroke-width: 2.5; rx: 12; }
      .line { fill: none; stroke: #222; stroke-width: 2.2; marker-end: url(#arrow); }
      .bidir { fill: none; stroke: #222; stroke-width: 2.2; marker-start: url(#arrow); marker-end: url(#arrow); }
      .blue { fill: none; stroke: #1769d1; stroke-width: 3; marker-end: url(#arrow-blue); }
      .bluebi { fill: none; stroke: #1769d1; stroke-width: 3; marker-start: url(#arrow-blue); marker-end: url(#arrow-blue); }
      .green { fill: none; stroke: #17823b; stroke-width: 3.2; marker-end: url(#arrow-green); }
      .greenbi { fill: none; stroke: #17823b; stroke-width: 3.2; marker-start: url(#arrow-green); marker-end: url(#arrow-green); }
      .orange { fill: none; stroke: #d66a00; stroke-width: 3; marker-end: url(#arrow-orange); }
      .dash { fill: none; stroke: #333; stroke-width: 2; stroke-dasharray: 8 6; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1900" height="1120" fill="#ffffff"/>
  <text x="950" y="52" text-anchor="middle" class="title">PicoRV32 + CPU MMU + DMA/IOMMU SoC Architecture</text>

  <!-- CPU and CPU-side translation -->
  <rect x="35" y="180" width="175" height="145" class="box control"/>
  <text x="122" y="235" text-anchor="middle" class="head">PicoRV32 CPU</text>
  <text x="122" y="269" text-anchor="middle" class="label">Firmware execution</text>
  <text x="122" y="297" text-anchor="middle" class="small">IRQ controller</text>

  <rect x="285" y="145" width="230" height="215" class="box translation"/>
  <text x="400" y="186" text-anchor="middle" class="head">CPU-side MMU</text>
  <text x="400" y="222" text-anchor="middle" class="label">16-entry Page Table</text>
  <text x="400" y="250" text-anchor="middle" class="label">4-entry fully-associative TLB</text>
  <text x="400" y="278" text-anchor="middle" class="label">pseudo-LRU replacement</text>
  <text x="400" y="306" text-anchor="middle" class="label">VA → PA, R/W/X protection</text>
  <text x="400" y="334" text-anchor="middle" class="small">Own MMIO register window</text>

  <rect x="590" y="180" width="210" height="145" class="box control"/>
  <text x="695" y="230" text-anchor="middle" class="head">AXI4-Lite</text>
  <text x="695" y="258" text-anchor="middle" class="head">Address Router</text>
  <text x="695" y="292" text-anchor="middle" class="small">RAM / DMA / UART decode</text>

  <path d="M210 250 H285" class="bluebi"/>
  <text x="247" y="220" text-anchor="middle" class="bus" fill="#1769d1">AXI4-Lite</text>
  <text x="247" y="240" text-anchor="middle" class="small">CPU virtual address</text>

  <path d="M515 250 H590" class="bluebi"/>
  <text x="552" y="220" text-anchor="middle" class="bus" fill="#1769d1">AXI4-Lite</text>
  <text x="552" y="240" text-anchor="middle" class="small">PA / MMIO</text>

  <!-- DMA/IOMMU group -->
  <rect x="875" y="85" width="650" height="600" class="group"/>
  <text x="1200" y="122" text-anchor="middle" class="section">DMA + DMA-side IOMMU IP</text>

  <rect x="905" y="150" width="190" height="78" class="box control"/>
  <text x="1000" y="180" text-anchor="middle" class="head">Control / Status</text>
  <text x="1000" y="207" text-anchor="middle" class="label">Registers</text>

  <rect x="905" y="250" width="190" height="75" class="box control"/>
  <text x="1000" y="279" text-anchor="middle" class="head">Descriptor FIFO</text>
  <text x="1000" y="306" text-anchor="middle" class="label">8 descriptors</text>

  <rect x="905" y="347" width="190" height="100" class="box control"/>
  <text x="1000" y="378" text-anchor="middle" class="head">DMA Access Controller</text>
  <text x="1000" y="407" text-anchor="middle" class="label">Request / Grant / Deny</text>
  <text x="1000" y="432" text-anchor="middle" class="small">Autonomous peripheral only</text>

  <rect x="1130" y="205" width="210" height="145" class="box translation"/>
  <text x="1235" y="238" text-anchor="middle" class="head">DMA Scheduler / FSM</text>
  <text x="1235" y="270" text-anchor="middle" class="label">13-state control</text>
  <text x="1235" y="298" text-anchor="middle" class="label">Chunking / engine select</text>
  <text x="1235" y="326" text-anchor="middle" class="small">Burst | Cycle-Stealing | Transparent</text>

  <rect x="1130" y="395" width="210" height="120" class="box translation"/>
  <text x="1235" y="428" text-anchor="middle" class="head">DMA-side IOMMU</text>
  <text x="1235" y="458" text-anchor="middle" class="label">IOVA → PA</text>
  <text x="1235" y="484" text-anchor="middle" class="small">TLB + PT + permission check</text>

  <rect x="1375" y="145" width="120" height="105" class="box dma"/>
  <text x="1435" y="179" text-anchor="middle" class="head">M2M</text>
  <text x="1435" y="207" text-anchor="middle" class="small">Memory</text>
  <text x="1435" y="229" text-anchor="middle" class="small">→ Memory</text>

  <rect x="1375" y="280" width="120" height="105" class="box dma"/>
  <text x="1435" y="314" text-anchor="middle" class="head">M2S</text>
  <text x="1435" y="342" text-anchor="middle" class="small">Memory</text>
  <text x="1435" y="364" text-anchor="middle" class="small">→ UART</text>

  <rect x="1375" y="415" width="120" height="105" class="box dma"/>
  <text x="1435" y="449" text-anchor="middle" class="head">S2M</text>
  <text x="1435" y="477" text-anchor="middle" class="small">UART</text>
  <text x="1435" y="499" text-anchor="middle" class="small">→ Memory</text>

  <rect x="1065" y="580" width="390" height="72" class="box dma"/>
  <text x="1260" y="610" text-anchor="middle" class="head">Internal DMA AXI4 Crossbar</text>
  <text x="1260" y="636" text-anchor="middle" class="small">Independent read/write Round-Robin arbitration</text>

  <!-- DMA internal control -->
  <path d="M1000 228 V250" class="line"/>
  <path d="M1000 325 V347" class="line"/>
  <path d="M1095 397 H1110 V277 H1130" class="line"/>
  <path d="M1095 189 H1110 V235 H1130" class="line"/>
  <path d="M1235 350 V395" class="bidir"/>
  <text x="1250" y="376" class="small">IOVA request / PA response</text>
  <path d="M1340 245 H1360 V198 H1375" class="line"/>
  <path d="M1340 277 H1360 V332 H1375" class="line"/>
  <path d="M1340 309 H1350 V467 H1375" class="line"/>
  <path d="M1435 250 V560 H1160 V580" class="line"/>
  <path d="M1435 385 V545 H1260 V580" class="line"/>
  <path d="M1435 520 V560 H1360 V580" class="line"/>

  <!-- CPU control connection to DMA registers -->
  <path d="M800 225 H905" class="bluebi"/>
  <text x="852" y="196" text-anchor="middle" class="bus" fill="#1769d1">AXI4-Lite</text>
  <text x="852" y="216" text-anchor="middle" class="small">DMA/IOMMU control &amp; status</text>

  <!-- UART -->
  <rect x="1610" y="300" width="190" height="160" class="box control"/>
  <text x="1705" y="345" text-anchor="middle" class="head">UART Controller</text>
  <text x="1705" y="378" text-anchor="middle" class="label">AXI4-Lite registers</text>
  <text x="1705" y="406" text-anchor="middle" class="label">AXI-Stream data</text>
  <text x="1705" y="434" text-anchor="middle" class="small">TX / RX engine</text>

  <rect x="1815" y="330" width="70" height="100" class="box memory"/>
  <text x="1850" y="365" text-anchor="middle" class="head">UART</text>
  <text x="1850" y="392" text-anchor="middle" class="label">TX/RX</text>
  <text x="1850" y="415" text-anchor="middle" class="small">pins</text>
  <path d="M1800 380 H1815" class="bidir"/>

  <path d="M1495 332 H1580 V335 H1610" class="orange"/>
  <text x="1552" y="316" text-anchor="middle" class="bus" fill="#d66a00">AXI-Stream TX</text>
  <path d="M1610 425 H1570 V467 H1495" class="orange"/>
  <text x="1550" y="455" text-anchor="middle" class="bus" fill="#d66a00">AXI-Stream RX</text>

  <!-- AXI-Lite UART control, routed below the IP -->
  <path d="M695 325 V705 H1705 V460" class="bluebi"/>
  <text x="905" y="696" class="bus" fill="#1769d1">AXI4-Lite UART configuration / status</text>

  <!-- Shared memory fabric -->
  <rect x="650" y="770" width="650" height="100" class="box dma"/>
  <text x="975" y="810" text-anchor="middle" class="section">System AXI4-Full Crossbar</text>
  <text x="975" y="840" text-anchor="middle" class="label">2 input ports → 1 memory port, independent Round-Robin arbitration</text>

  <path d="M695 325 V740 H800 V770" class="green"/>
  <text x="714" y="620" class="bus" fill="#17823b">CPU RAM branch</text>
  <text x="714" y="642" class="small">single-beat AXI4</text>

  <path d="M1260 652 V730 H1150 V770" class="green"/>
  <text x="1275" y="716" class="bus" fill="#17823b">DMA AXI4-Full Master (burst)</text>

  <rect x="740" y="930" width="310" height="95" class="box memory"/>
  <text x="895" y="970" text-anchor="middle" class="head">AXI RAM Controller</text>
  <text x="895" y="999" text-anchor="middle" class="small">AXI protocol → BRAM access</text>

  <rect x="1170" y="930" width="300" height="95" class="box memory"/>
  <text x="1320" y="970" text-anchor="middle" class="head">64 KiB Internal BRAM</text>
  <text x="1320" y="999" text-anchor="middle" class="small">32-bit words, firmware + data</text>

  <path d="M895 870 V930" class="greenbi"/>
  <text x="910" y="899" class="bus" fill="#17823b">AXI4-Full: AW / W / B / AR / R</text>
  <path d="M1050 978 H1170" class="greenbi"/>

  <!-- IRQ and authorization sideband -->
  <path d="M400 145 V100 H122 V180" class="dash"/>
  <text x="280" y="91" class="small">CPU MMU fault IRQ</text>
  <path d="M1000 150 V72 H90 V180" class="dash"/>
  <text x="520" y="68" class="small">DMA DONE/FAULT IRQ or autonomous access request</text>
  <path d="M1610 445 V735 H70 V325" class="dash"/>
  <text x="325" y="728" class="small">UART IRQ</text>
  <path d="M210 300 H245 V395 H905" class="dash"/>
  <text x="550" y="385" class="small">CPU Grant / Deny for autonomous UART request through DMA registers</text>

  <!-- Legend -->
  <rect x="170" y="1060" width="1560" height="45" fill="#fafafa" stroke="#a8b0bb" rx="7"/>
  <line x1="210" y1="1083" x2="280" y2="1083" stroke="#1769d1" stroke-width="4"/>
  <text x="290" y="1089" class="bus" fill="#1769d1">AXI4-Lite — control / CPU single access</text>
  <line x1="690" y1="1083" x2="760" y2="1083" stroke="#17823b" stroke-width="4"/>
  <text x="770" y="1089" class="bus" fill="#17823b">AXI4-Full — memory data / burst</text>
  <line x1="1130" y1="1083" x2="1200" y2="1083" stroke="#d66a00" stroke-width="4"/>
  <text x="1210" y="1089" class="bus" fill="#d66a00">AXI-Stream — UART payload</text>
  <line x1="1465" y1="1083" x2="1535" y2="1083" stroke="#333" stroke-width="3" stroke-dasharray="8 6"/>
  <text x="1545" y="1089" class="label">IRQ / status</text>
</svg>
