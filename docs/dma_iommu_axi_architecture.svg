<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="1320" viewBox="0 0 2000 1320">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.14"/>
    </filter>
    <marker id="arrow-blue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L12,6 L0,12 z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-green" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L12,6 L0,12 z" fill="#059669"/>
    </marker>
    <marker id="arrow-orange" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L12,6 L0,12 z" fill="#d97706"/>
    </marker>
    <marker id="arrow-purple" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L12,6 L0,12 z" fill="#7c3aed"/>
    </marker>
    <marker id="arrow-red" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L12,6 L0,12 z" fill="#dc2626"/>
    </marker>
    <marker id="arrow-gray" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L12,6 L0,12 z" fill="#475569"/>
    </marker>
    <style>
      .title { font: 700 34px 'Segoe UI', Arial, sans-serif; fill: #0f172a; }
      .subtitle { font: 500 17px 'Segoe UI', Arial, sans-serif; fill: #475569; }
      .group-title { font: 700 23px 'Segoe UI', Arial, sans-serif; fill: #0f172a; }
      .box-title { font: 700 19px 'Segoe UI', Arial, sans-serif; fill: #0f172a; }
      .module { font: 600 15px 'Consolas', 'Courier New', monospace; fill: #334155; }
      .body { font: 500 15px 'Segoe UI', Arial, sans-serif; fill: #334155; }
      .small { font: 500 13px 'Segoe UI', Arial, sans-serif; fill: #475569; }
      .tiny { font: 500 12px 'Segoe UI', Arial, sans-serif; fill: #64748b; }
      .label-blue { font: 700 14px 'Segoe UI', Arial, sans-serif; fill: #1d4ed8; }
      .label-green { font: 700 14px 'Segoe UI', Arial, sans-serif; fill: #047857; }
      .label-orange { font: 700 14px 'Segoe UI', Arial, sans-serif; fill: #b45309; }
      .label-purple { font: 700 14px 'Segoe UI', Arial, sans-serif; fill: #6d28d9; }
      .label-red { font: 700 14px 'Segoe UI', Arial, sans-serif; fill: #b91c1c; }
      .arrow-blue { fill: none; stroke: #2563eb; stroke-width: 4; marker-end: url(#arrow-blue); }
      .arrow-green { fill: none; stroke: #059669; stroke-width: 4; marker-end: url(#arrow-green); }
      .arrow-orange { fill: none; stroke: #d97706; stroke-width: 4; marker-end: url(#arrow-orange); }
      .arrow-purple { fill: none; stroke: #7c3aed; stroke-width: 4; marker-end: url(#arrow-purple); }
      .arrow-red { fill: none; stroke: #dc2626; stroke-width: 3.5; marker-end: url(#arrow-red); }
      .arrow-gray { fill: none; stroke: #475569; stroke-width: 3.5; marker-end: url(#arrow-gray); }
      .dashed { stroke-dasharray: 10 7; }
    </style>
  </defs>

  <rect width="2000" height="1320" fill="#f8fafc"/>
  <text x="1000" y="48" text-anchor="middle" class="title">KIẾN TRÚC TỔNG THỂ IP DMA + IOMMU TRÊN AXI4</text>
  <text x="1000" y="78" text-anchor="middle" class="subtitle">Sơ đồ bám sát source hiện tại • 3 hướng truyền • 3 chế độ DMA • IOMMU phân trang + TLB pseudo-LRU</text>

  <!-- Legend -->
  <g transform="translate(1340,92)">
    <rect x="0" y="0" width="610" height="46" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
    <circle cx="28" cy="23" r="8" fill="#2563eb"/><text x="44" y="28" class="small">Điều khiển</text>
    <circle cx="154" cy="23" r="8" fill="#d97706"/><text x="170" y="28" class="small">Dịch địa chỉ/quyền</text>
    <circle cx="350" cy="23" r="8" fill="#059669"/><text x="366" y="28" class="small">Dữ liệu</text>
    <circle cx="460" cy="23" r="8" fill="#7c3aed"/><text x="476" y="28" class="small">AXI memory</text>
  </g>

  <!-- External CPU -->
  <g filter="url(#shadow)">
    <rect x="35" y="245" width="225" height="330" rx="20" fill="#ffffff" stroke="#64748b" stroke-width="3"/>
    <rect x="35" y="245" width="225" height="58" rx="20" fill="#e2e8f0"/>
    <path d="M35 283 L35 265 Q35 245 55 245 L240 245 Q260 245 260 265 L260 303 L35 303 Z" fill="#e2e8f0"/>
    <text x="147" y="281" text-anchor="middle" class="group-title">CPU / HOST</text>
    <text x="147" y="340" text-anchor="middle" class="body">Cấu hình descriptor</text>
    <text x="147" y="368" text-anchor="middle" class="body">Lập trình Page Table</text>
    <text x="147" y="396" text-anchor="middle" class="body">Start / Status / IRQ</text>
    <line x1="65" y1="424" x2="230" y2="424" stroke="#cbd5e1" stroke-width="2"/>
    <text x="147" y="458" text-anchor="middle" class="body">cpu_bus_idle_i</text>
    <text x="147" y="486" text-anchor="middle" class="small">dùng cho Transparent</text>
    <text x="147" y="535" text-anchor="middle" class="small">Không đi qua IOMMU CPU</text>
  </g>

  <!-- External Peripheral -->
  <g filter="url(#shadow)">
    <rect x="1740" y="350" width="225" height="350" rx="20" fill="#ffffff" stroke="#64748b" stroke-width="3"/>
    <rect x="1740" y="350" width="225" height="64" rx="20" fill="#dcfce7"/>
    <path d="M1740 390 L1740 370 Q1740 350 1760 350 L1945 350 Q1965 350 1965 370 L1965 414 L1740 414 Z" fill="#dcfce7"/>
    <text x="1852" y="382" text-anchor="middle" class="group-title">THIẾT BỊ</text>
    <text x="1852" y="405" text-anchor="middle" class="group-title">NGOẠI VI</text>
    <text x="1852" y="468" text-anchor="middle" class="box-title">AXI4-Stream</text>
    <text x="1852" y="505" text-anchor="middle" class="body">S_AXIS: thiết bị → DMA</text>
    <text x="1852" y="535" text-anchor="middle" class="body">M_AXIS: DMA → thiết bị</text>
    <line x1="1770" y1="565" x2="1935" y2="565" stroke="#bbf7d0" stroke-width="2"/>
    <text x="1852" y="604" text-anchor="middle" class="small">TDATA / TKEEP</text>
    <text x="1852" y="631" text-anchor="middle" class="small">TVALID / TREADY / TLAST</text>
    <text x="1852" y="672" text-anchor="middle" class="small">Không phải AXI-Mapped peripheral</text>
  </g>

  <!-- Main IP boundary -->
  <rect x="290" y="150" width="1415" height="875" rx="26" fill="#ffffff" stroke="#0f172a" stroke-width="4"/>
  <rect x="290" y="150" width="1415" height="58" rx="26" fill="#e0f2fe"/>
  <path d="M290 184 L290 176 Q290 150 316 150 L1679 150 Q1705 150 1705 176 L1705 208 L290 208 Z" fill="#e0f2fe"/>
  <text x="315" y="188" class="group-title">dma_mmu_axi_top</text>
  <text x="1668" y="188" text-anchor="end" class="module">IP tổng hợp: DMA datapath + IOMMU bảo vệ truy cập</text>

  <!-- Control registers -->
  <g filter="url(#shadow)">
    <rect x="330" y="240" width="350" height="210" rx="18" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/>
    <text x="505" y="275" text-anchor="middle" class="box-title">AXI4-Lite Control / Status</text>
    <text x="505" y="300" text-anchor="middle" class="module">dma_axil_regs</text>
    <text x="355" y="333" class="body">• src/dst virtual address, length</text>
    <text x="355" y="359" class="body">• transfer type, DMA mode, burst words</text>
    <text x="355" y="385" class="body">• Page Table registers / TLB invalidate</text>
    <text x="355" y="411" class="body">• busy, done, fault, fault_code, IRQ</text>
    <text x="505" y="438" text-anchor="middle" class="tiny">AXI-Lite slave • CPU software programmed</text>
  </g>

  <!-- Scheduler -->
  <g filter="url(#shadow)">
    <rect x="755" y="235" width="500" height="255" rx="18" fill="#eef2ff" stroke="#4f46e5" stroke-width="3"/>
    <text x="1005" y="271" text-anchor="middle" class="box-title">Descriptor Scheduler + Mode Controller</text>
    <text x="1005" y="297" text-anchor="middle" class="module">dma_axi_scheduler</text>
    <rect x="785" y="322" width="135" height="54" rx="10" fill="#ffffff" stroke="#93c5fd"/>
    <text x="852" y="345" text-anchor="middle" class="body">Burst</text>
    <text x="852" y="365" text-anchor="middle" class="tiny">n beat/chunk</text>
    <rect x="937" y="322" width="135" height="54" rx="10" fill="#ffffff" stroke="#93c5fd"/>
    <text x="1004" y="345" text-anchor="middle" class="body">Cycle Steal</text>
    <text x="1004" y="365" text-anchor="middle" class="tiny">1 beat + gap</text>
    <rect x="1089" y="322" width="135" height="54" rx="10" fill="#ffffff" stroke="#93c5fd"/>
    <text x="1156" y="345" text-anchor="middle" class="body">Transparent</text>
    <text x="1156" y="365" text-anchor="middle" class="tiny">chờ CPU idle</text>
    <text x="785" y="410" class="body">• Chia transfer theo chunk và biên trang 4 KiB</text>
    <text x="785" y="435" class="body">• Xin phép IOMMU cho nguồn/đích trước khi truyền</text>
    <text x="785" y="460" class="body">• Phát descriptor, thu status, sinh done/fault</text>
  </g>

  <!-- IOMMU group -->
  <g>
    <rect x="330" y="515" width="555" height="440" rx="22" fill="#fffbeb" stroke="#d97706" stroke-width="3"/>
    <text x="607" y="550" text-anchor="middle" class="group-title">IOMMU ĐỘC LẬP — DỊCH ĐỊA CHỈ &amp; CẤP QUYỀN</text>
    <text x="607" y="576" text-anchor="middle" class="module">dma_iommu_tlb</text>

    <rect x="365" y="605" width="485" height="58" rx="12" fill="#ffffff" stroke="#f59e0b" stroke-width="2"/>
    <text x="607" y="630" text-anchor="middle" class="box-title">Lookup Controller</text>
    <text x="607" y="651" text-anchor="middle" class="small">vaddr + length + read/write • kiểm tra cùng trang</text>

    <rect x="365" y="690" width="200" height="115" rx="14" fill="#fff7ed" stroke="#f59e0b" stroke-width="2"/>
    <text x="465" y="722" text-anchor="middle" class="box-title">TLB (4 entries)</text>
    <text x="465" y="750" text-anchor="middle" class="body">VPN → PPN</text>
    <text x="465" y="776" text-anchor="middle" class="small">Valid / Read / Write</text>

    <rect x="635" y="690" width="215" height="115" rx="14" fill="#fff7ed" stroke="#f59e0b" stroke-width="2"/>
    <text x="742" y="719" text-anchor="middle" class="box-title">Page Table</text>
    <text x="742" y="746" text-anchor="middle" class="body">16 PTE • trang 4 KiB</text>
    <text x="742" y="773" text-anchor="middle" class="small">CPU ghi qua AXI-Lite</text>

    <rect x="365" y="835" width="200" height="82" rx="14" fill="#ffffff" stroke="#f59e0b" stroke-width="2"/>
    <text x="465" y="866" text-anchor="middle" class="box-title">pseudo-LRU</text>
    <text x="465" y="893" text-anchor="middle" class="small">chọn TLB victim khi đầy</text>

    <rect x="635" y="825" width="215" height="100" rx="14" fill="#fff1f2" stroke="#dc2626" stroke-width="2"/>
    <text x="742" y="855" text-anchor="middle" class="box-title">Permission Check</text>
    <text x="742" y="881" text-anchor="middle" class="small">Valid / Read / Write / Range</text>
    <text x="742" y="907" text-anchor="middle" class="label-red">allow + paddr hoặc fault</text>

    <path d="M607 663 L607 678 L465 678 L465 690" class="arrow-orange"/>
    <path d="M607 663 L607 678 L742 678 L742 690" class="arrow-orange"/>
    <path d="M465 805 L465 835" class="arrow-orange"/>
    <path d="M565 747 L620 747 L620 875 L635 875" class="arrow-orange"/>
    <path d="M742 805 L742 825" class="arrow-orange"/>
  </g>

  <!-- Data engines group -->
  <g>
    <rect x="915" y="515" width="750" height="440" rx="22" fill="#ecfdf5" stroke="#059669" stroke-width="3"/>
    <text x="1290" y="538" text-anchor="middle" class="group-title">DMA DATA PLANE — BA HƯỚNG TRUYỀN</text>

    <g filter="url(#shadow)">
      <rect x="950" y="590" width="290" height="135" rx="16" fill="#ffffff" stroke="#10b981" stroke-width="2.5"/>
      <text x="1095" y="623" text-anchor="middle" class="box-title">Memory → Memory</text>
      <text x="1095" y="650" text-anchor="middle" class="module">axi_cdma</text>
      <text x="1095" y="680" text-anchor="middle" class="body">AXI Read + AXI Write</text>
      <text x="1095" y="705" text-anchor="middle" class="small">FIFO/burst logic nội bộ engine</text>
    </g>

    <g filter="url(#shadow)">
      <rect x="1320" y="590" width="305" height="135" rx="16" fill="#ffffff" stroke="#10b981" stroke-width="2.5"/>
      <text x="1472" y="623" text-anchor="middle" class="box-title">Memory → Peripheral</text>
      <text x="1472" y="650" text-anchor="middle" class="module">axi_dma_rd</text>
      <text x="1472" y="680" text-anchor="middle" class="body">AXI Read → M_AXIS</text>
      <text x="1472" y="705" text-anchor="middle" class="small">TLAST theo byte counter toàn transfer</text>
    </g>

    <g filter="url(#shadow)">
      <rect x="1320" y="770" width="305" height="135" rx="16" fill="#ffffff" stroke="#10b981" stroke-width="2.5"/>
      <text x="1472" y="803" text-anchor="middle" class="box-title">Peripheral → Memory</text>
      <text x="1472" y="830" text-anchor="middle" class="module">axi_dma_wr</text>
      <text x="1472" y="860" text-anchor="middle" class="body">S_AXIS → AXI Write</text>
      <text x="1472" y="885" text-anchor="middle" class="small">descriptor length điều khiển chunk</text>
    </g>

    <rect x="950" y="780" width="290" height="105" rx="16" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2.5"/>
    <text x="1095" y="812" text-anchor="middle" class="box-title">AXI Read/Write Arbitration</text>
    <text x="1095" y="839" text-anchor="middle" class="module">axi_crossbar • 2 → 1</text>
    <text x="1095" y="865" text-anchor="middle" class="small">Round-robin độc lập Read/Write</text>

    <path d="M1095 725 L1095 780" class="arrow-purple"/>
    <path d="M1320 657 L1268 657 L1268 815 L1240 815" class="arrow-purple"/>
    <path d="M1320 838 L1240 838" class="arrow-purple"/>
  </g>

  <!-- CPU/control arrows -->
  <path d="M260 315 L330 315" class="arrow-blue"/>
  <text x="295" y="301" text-anchor="middle" class="label-blue">AXI4-Lite</text>
  <path d="M330 405 L290 405 L290 545 L260 545" class="arrow-blue dashed"/>
  <text x="275" y="470" text-anchor="middle" class="label-blue" transform="rotate(-90 275 470)">IRQ / Status</text>
  <path d="M260 470 L710 470 L710 390 L755 390" class="arrow-blue dashed"/>
  <text x="490" y="458" text-anchor="middle" class="label-blue">cpu_bus_idle_i</text>
  <path d="M680 330 L755 330" class="arrow-blue"/>
  <text x="718" y="316" text-anchor="middle" class="label-blue">Config</text>
  <path d="M680 390 L720 390 L720 580 L742 580 L742 690" class="arrow-blue"/>
  <text x="704" y="558" text-anchor="middle" class="label-blue" transform="rotate(-90 704 558)">PTE write / invalidate</text>
  <path d="M755 450 L700 450 L700 490 L505 490 L505 450" class="arrow-blue dashed"/>
  <text x="615" y="482" text-anchor="middle" class="label-blue">busy / done / fault</text>

  <!-- Scheduler/IOMMU request-response -->
  <path d="M900 490 L900 525 L850 525 L850 634" class="arrow-orange"/>
  <text x="905" y="520" class="label-orange">vaddr, len, R/W</text>
  <path d="M850 885 L900 885 L900 475 L930 475" class="arrow-red"/>
  <text x="908" y="745" class="label-red" transform="rotate(-90 908 745)">allow / paddr / fault</text>

  <!-- Scheduler descriptors to engines -->
  <path d="M1135 490 L1135 575 L1095 575 L1095 590" class="arrow-green"/>
  <text x="1095" y="568" text-anchor="middle" class="label-green">M2M descriptor</text>
  <path d="M1185 490 L1185 575 L1472 575 L1472 590" class="arrow-green"/>
  <text x="1370" y="568" text-anchor="middle" class="label-green">M2S descriptor</text>
  <path d="M1220 490 L1220 745 L1472 745 L1472 770" class="arrow-green"/>
  <text x="1370" y="735" text-anchor="middle" class="label-green">S2M descriptor</text>

  <!-- AXI Stream data arrows -->
  <path d="M1625 640 L1705 640 L1705 465 L1740 465" class="arrow-green"/>
  <text x="1680" y="625" text-anchor="middle" class="label-green">M_AXIS</text>
  <path d="M1740 590 L1690 590 L1690 838 L1625 838" class="arrow-green"/>
  <text x="1670" y="824" text-anchor="middle" class="label-green">S_AXIS</text>

  <!-- AXI memory master and system -->
  <rect x="735" y="970" width="615" height="78" rx="16" fill="#f5f3ff" stroke="#7c3aed" stroke-width="3" filter="url(#shadow)"/>
  <text x="1042" y="1000" text-anchor="middle" class="box-title">AXI4-Full Master Interface</text>
  <text x="1042" y="1027" text-anchor="middle" class="small">AW/W/B + AR/R • data 32-bit • address 16-bit (mặc định)</text>
  <path d="M1095 885 L1095 970" class="arrow-purple"/>
  <text x="1110" y="935" class="label-purple">M_AXI</text>

  <rect x="590" y="1080" width="905" height="70" rx="16" fill="#ede9fe" stroke="#7c3aed" stroke-width="3" filter="url(#shadow)"/>
  <text x="1042" y="1110" text-anchor="middle" class="box-title">System AXI Interconnect / SmartConnect</text>
  <text x="1042" y="1136" text-anchor="middle" class="small">Kết nối IP master tới bộ nhớ hệ thống</text>
  <path d="M1042 1048 L1042 1080" class="arrow-purple"/>

  <!-- Memory -->
  <g filter="url(#shadow)">
    <rect x="795" y="1180" width="495" height="90" rx="18" fill="#ffffff" stroke="#475569" stroke-width="3"/>
    <text x="1042" y="1217" text-anchor="middle" class="group-title">MEMORY</text>
    <text x="1042" y="1248" text-anchor="middle" class="body">DDR / BRAM / AXI RAM</text>
  </g>
  <path d="M1042 1150 L1042 1180" class="arrow-purple"/>

  <!-- Correctness callout -->
  <g>
    <rect x="35" y="820" width="225" height="300" rx="18" fill="#fff1f2" stroke="#ef4444" stroke-width="2"/>
    <text x="147" y="854" text-anchor="middle" class="box-title">ĐÃ LOẠI KHỎI</text>
    <text x="147" y="879" text-anchor="middle" class="box-title">SƠ ĐỒ MẪU</text>
    <text x="55" y="920" class="body">✕ CPU iTLB / dTLB</text>
    <text x="55" y="948" class="body">✕ satp / sfence.vma</text>
    <text x="55" y="976" class="body">✕ Page Table Walker</text>
    <text x="55" y="1004" class="body">✕ CSR/exception CPU</text>
    <text x="55" y="1032" class="body">✕ axi_cdma_desc_mux</text>
    <text x="55" y="1060" class="body">✕ axi_dma wrapper</text>
    <text x="147" y="1094" text-anchor="middle" class="tiny">Không tồn tại trong source AXI hiện tại</text>
  </g>

  <!-- Footer -->
  <text x="1000" y="1302" text-anchor="middle" class="tiny">Source-grounded: dma_mmu_axi_top.sv • dma_axil_regs.sv • dma_axi_scheduler.sv • dma_iommu_tlb.sv • axi_cdma.v • axi_dma_rd.v • axi_dma_wr.v • axi_crossbar.v</text>
</svg>
