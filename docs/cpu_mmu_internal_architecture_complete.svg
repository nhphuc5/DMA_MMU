<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1120" viewBox="0 0 1800 1120">
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0 L0 0 0 24" fill="none" stroke="#22303a" stroke-width="0.7" opacity="0.55"/>
      <path d="M6 0V24 M12 0V24 M18 0V24 M0 6H24 M0 12H24 M0 18H24" fill="none" stroke="#18232b" stroke-width="0.45" opacity="0.4"/>
    </pattern>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#f5f7fa"/>
    </marker>
    <style>
      .title { font:700 35px Arial,sans-serif; fill:#f6f8fb; }
      .subtitle { font:700 23px Arial,sans-serif; fill:#f6f8fb; }
      .bt { font:700 18px Arial,sans-serif; fill:#f8fafc; text-anchor:middle; }
      .bs { font:500 13px Arial,sans-serif; fill:#dce4ec; text-anchor:middle; }
      .label { font:600 13px Arial,sans-serif; fill:#f8fafc; }
      .small { font:500 12px Arial,sans-serif; fill:#dce4ec; }
      .box { fill:#10161b; stroke-width:2.2; rx:8; }
      .iface { stroke:#39a9ff; }
      .control { stroke:#b56cff; }
      .lookup { stroke:#ffc928; }
      .system { stroke:#7ee14b; }
      .fault { stroke:#ff6b79; }
      .bus { stroke:#edf2f7; }
      .wire { fill:none; stroke:#f5f7fa; stroke-width:2; marker-end:url(#arrow); }
      .status { fill:none; stroke:#f5f7fa; stroke-width:1.8; stroke-dasharray:7 5; marker-end:url(#arrow); }
      .outer { fill:none; stroke:#e8eef4; stroke-width:2.4; rx:14; }
    </style>
  </defs>

  <rect width="1800" height="1120" fill="#090d10"/>
  <rect width="1800" height="1120" fill="url(#grid)"/>
  <text class="title" x="900" y="48" text-anchor="middle">KIẾN TRÚC MMU TRONG CPU PicoRV32</text>
  <rect class="outer" x="270" y="70" width="1260" height="970"/>
  <text class="subtitle" x="900" y="102" text-anchor="middle">CPU-SIDE MMU — picorv32_cpu_mmu</text>

  <!-- External CPU and downstream router -->
  <rect class="box iface" x="25" y="405" width="215" height="125"/>
  <text class="bt" x="132" y="448">PicoRV32 CPU Core</text>
  <text class="bs" x="132" y="475">Instruction fetch + load/store</text>
  <text class="bs" x="132" y="500">32-bit AXI4-Lite master</text>

  <rect class="box system" x="1555" y="405" width="220" height="125"/>
  <text class="bt" x="1665" y="447">AXI4-Lite Address</text>
  <text class="bt" x="1665" y="470">Router / System</text>
  <text class="bs" x="1665" y="500">RAM | DMA | UART decode</text>

  <!-- Front end and local control -->
  <rect class="box iface" x="310" y="125" width="310" height="78"/>
  <text class="bt" x="465" y="157">S_AXIL — AXI4-Lite Slave</text>
  <text class="bs" x="465" y="183">CPU-facing request / response</text>

  <rect class="box control" x="730" y="115" width="470" height="100"/>
  <text class="bt" x="965" y="148">MMU Control / Status Registers</text>
  <text class="bs" x="965" y="174">Local window: 0x3000_0000</text>
  <text class="bs" x="965" y="196">PT index/VPN/PPN/V/R/W/X | enable | invalidate</text>

  <rect class="box control" x="310" y="260" width="340" height="100"/>
  <text class="bt" x="480" y="298">Request Capture +</text>
  <text class="bt" x="480" y="322">Address Classifier</text>
  <text class="bs" x="480" y="346">local registers | bypass | translate</text>

  <rect class="box lookup" x="1120" y="260" width="350" height="100"/>
  <text class="bt" x="1295" y="298">Physical MMIO Bypass</text>
  <text class="bs" x="1295" y="326">0x1000_0000 DMA | 0x2000_0000 UART</text>
  <text class="bs" x="1295" y="347">Upper regions are not translated</text>

  <!-- Read and write pipelines -->
  <rect class="box lookup" x="310" y="420" width="290" height="95"/>
  <text class="bt" x="455" y="453">Write FSM — 8 states</text>
  <text class="bs" x="455" y="479">Collect AW + W independently</text>
  <text class="bs" x="455" y="500">classify → lookup → send → B</text>

  <rect class="box lookup" x="660" y="420" width="290" height="95"/>
  <text class="bt" x="805" y="453">Read / Fetch FSM — 8 states</text>
  <text class="bs" x="805" y="479">Capture AR + ARPROT</text>
  <text class="bs" x="805" y="500">classify → lookup → send → R</text>

  <rect class="box iface" x="1210" y="420" width="290" height="90"/>
  <text class="bt" x="1355" y="453">M_AXIL — AXI4-Lite Master</text>
  <text class="bs" x="1355" y="479">Physical AW/W/B + AR/R</text>
  <text class="bs" x="1355" y="499">System-router-facing interface</text>

  <!-- Translation structures -->
  <rect class="box lookup" x="500" y="580" width="430" height="100"/>
  <text class="bt" x="715" y="615">TLB — 4 entries, fully associative</text>
  <text class="bs" x="715" y="643">VPN → PPN + Read/Write/Execute permissions</text>
  <text class="bs" x="715" y="664">Parallel comparison; registered hit result</text>

  <rect class="box lookup" x="500" y="725" width="430" height="110"/>
  <text class="bt" x="715" y="760">Software-managed Page Table</text>
  <text class="bs" x="715" y="788">16 fully-associative entries</text>
  <text class="bs" x="715" y="810">VPN | PPN | Valid | Read | Write | Execute</text>

  <rect class="box control" x="1000" y="580" width="245" height="100"/>
  <text class="bt" x="1122" y="615">TLB Fill Selector</text>
  <text class="bs" x="1122" y="643">Use invalid entry first</text>
  <text class="bs" x="1122" y="663">otherwise replacement_idx</text>

  <rect class="box control" x="1000" y="725" width="245" height="85"/>
  <text class="bt" x="1122" y="760">Pseudo-LRU</text>
  <text class="bs" x="1122" y="786">4-entry replacement state</text>

  <rect class="box lookup" x="450" y="890" width="360" height="95"/>
  <text class="bt" x="630" y="924">Permission Check</text>
  <text class="bs" x="630" y="951">Write | Read | Execute from ARPROT[2]</text>
  <text class="bs" x="630" y="971">deny access when permission is absent</text>

  <rect class="box lookup" x="850" y="890" width="360" height="95"/>
  <text class="bt" x="1030" y="924">Address Translation</text>
  <text class="bs" x="1030" y="951">PA = PPN || page offset</text>
  <text class="bs" x="1030" y="971">4 KiB pages — PAGE_SHIFT = 12</text>

  <rect class="box fault" x="1260" y="645" width="240" height="160"/>
  <text class="bt" x="1380" y="681">Fault + Status Logic</text>
  <text class="bs" x="1380" y="710">Page / Read / Write / Execute</text>
  <text class="bs" x="1380" y="734">sticky fault + fault VA</text>
  <text class="bs" x="1380" y="758">AXI SLVERR + fault_irq_o</text>
  <text class="bs" x="1380" y="782">0:none, 1:page, 2:R, 3:W, 4:X</text>

  <rect class="box control" x="1260" y="845" width="240" height="90"/>
  <text class="bt" x="1380" y="881">TLB Statistics</text>
  <text class="bs" x="1380" y="909">Hit counter | Miss counter</text>

  <!-- CPU-side request and response -->
  <path class="wire" d="M240 435 H310"/>
  <text class="label" x="62" y="391">CPU VA + AXI request</text>
  <path class="wire" d="M310 500 H240"/>
  <text class="small" x="54" y="553">AXI response / local fault response</text>
  <path class="wire" d="M465 203 V260"/>

  <!-- Classification branches -->
  <path class="wire" d="M650 292 H690 V165 H730"/>
  <text class="label" x="653" y="282">MMU register access</text>
  <path class="wire" d="M650 315 H1120"/>
  <text class="label" x="850" y="304">MMIO bypass</text>
  <path class="wire" d="M430 360 V392 H455 V420"/>
  <text class="label" x="330" y="389">Write request</text>
  <path class="wire" d="M525 360 V392 H805 V420"/>
  <text class="label" x="678" y="389">Read / fetch request</text>

  <!-- Register programming -->
  <path class="wire" d="M965 215 V700 H900 V725"/>
  <text class="label" x="978" y="246">PT programming</text>
  <text class="small" x="978" y="265">TLB invalidate / enable / clear fault</text>

  <!-- Lookup paths -->
  <path class="wire" d="M455 515 V545 H610 V580"/>
  <text class="label" x="468" y="537">write VPN lookup</text>
  <path class="wire" d="M805 515 V545 H820 V580"/>
  <text class="label" x="820" y="537">read/fetch VPN lookup</text>
  <path class="wire" d="M715 680 V725"/>
  <text class="label" x="730" y="708">TLB miss → PT search</text>
  <path class="wire" d="M650 680 V858 H630 V890"/>
  <text class="label" x="666" y="857">TLB hit: selected PPN + permissions</text>
  <path class="wire" d="M620 835 V890"/>
  <text class="label" x="505" y="870">PT hit result</text>

  <!-- TLB fill and replacement -->
  <path class="wire" d="M930 770 H970 V630 H1000"/>
  <text class="label" x="942" y="754">PT entry</text>
  <path class="wire" d="M1122 725 V680"/>
  <text class="label" x="1136" y="708">replacement_idx</text>
  <path class="wire" d="M1000 610 H960 V630 H930"/>
  <text class="label" x="938" y="596">TLB fill</text>

  <!-- Permission, translation, faults, counters -->
  <path class="wire" d="M810 937 H850"/>
  <text class="label" x="816" y="925">allow</text>
  <path class="wire" d="M810 910 H1180 V725 H1260"/>
  <text class="label" x="1015" y="899">permission fault</text>
  <path class="status" d="M930 815 H1180 V680 H1260"/>
  <text class="label" x="1016" y="803">page fault</text>
  <path class="status" d="M930 610 H1230 V870 H1260"/>
  <text class="label" x="1025" y="600">TLB hit / miss increment</text>

  <!-- Physical request paths -->
  <path class="wire" d="M1295 360 V420"/>
  <text class="label" x="1308" y="393">unchanged physical MMIO address</text>
  <path class="wire" d="M1030 890 V545 H1355 V510"/>
  <text class="label" x="1050" y="560">translated PA + AXI transaction</text>
  <path class="wire" d="M1500 450 H1555"/>
  <text class="label" x="1510" y="439">request</text>
  <path class="wire" d="M1555 492 H1500"/>
  <text class="small" x="1510" y="514">R/B response</text>

  <!-- Side outputs -->
  <path class="status" d="M1260 790 V1010 H260 V510 H240"/>
  <text class="label" x="785" y="1003">fault_irq_o + local AXI SLVERR response</text>
  <path class="status" d="M310 475 H280 V955 H25"/>
  <text class="label" x="40" y="945">cpu_idle_o → DMA Transparent mode</text>

  <!-- Notes and legend -->
  <text class="small" x="285" y="1025">CPU MMU translates CPU accesses only. DMA data uses the independent DMA-side IOMMU.</text>
  <rect class="box bus" x="1535" y="865" width="240" height="145"/>
  <text class="bt" x="1655" y="897">CHÚ THÍCH</text>
  <path class="wire" d="M1560 928 H1630"/>
  <text class="small" x="1644" y="933">Dữ liệu / điều khiển</text>
  <path class="status" d="M1560 966 H1630"/>
  <text class="small" x="1644" y="971">Status / IRQ</text>
  <text class="small" x="1560" y="997">MMIO register window is local</text>
</svg>
