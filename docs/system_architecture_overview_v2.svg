<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1200" viewBox="0 0 1800 1200">
  <defs>
    <style>
      .title { font: 700 36px Arial, sans-serif; fill: #10244a; }
      .subtitle { font: 500 18px Arial, sans-serif; fill: #50627f; }
      .block-title { font: 700 24px Arial, sans-serif; fill: #10213d; }
      .block-text { font: 17px Arial, sans-serif; fill: #1e2d45; }
      .small { font: 15px Arial, sans-serif; fill: #33445f; }
      .bus-label { font: 700 17px Arial, sans-serif; fill: #14284c; }
      .port { font: 700 18px Arial, sans-serif; fill: #10213d; }
      .section { font: 700 17px Arial, sans-serif; fill: #52657d; letter-spacing: 1px; }
      .box { stroke: #18345d; stroke-width: 2.5; rx: 14; ry: 14; }
      .lite { stroke: #2764c5; stroke-width: 5; fill: none; }
      .full { stroke: #6235c9; stroke-width: 7; fill: none; }
      .stream-rx { stroke: #10946b; stroke-width: 6; fill: none; }
      .stream-tx { stroke: #0876b9; stroke-width: 6; fill: none; }
      .side { stroke: #65758b; stroke-width: 3; stroke-dasharray: 8 7; fill: none; }
      .clock { stroke: #9aa8ba; stroke-width: 2.5; stroke-dasharray: 6 6; fill: none; }
    </style>
    <marker id="arrowLite" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2764c5"/></marker>
    <marker id="arrowFull" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6235c9"/></marker>
    <marker id="arrowRx" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#10946b"/></marker>
    <marker id="arrowTx" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0876b9"/></marker>
    <marker id="arrowSide" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#65758b"/></marker>
  </defs>

  <rect width="1800" height="1200" fill="#ffffff"/>
  <text x="900" y="54" text-anchor="middle" class="title">KIẾN TRÚC TỔNG THỂ HỆ THỐNG PicoRV32 + DMA + IOMMU + UART</text>
  <text x="900" y="84" text-anchor="middle" class="subtitle">Bám sát RTL hiện tại - tách rõ đường điều khiển, đường dữ liệu bộ nhớ và đường dữ liệu UART</text>

  <!-- Section backgrounds -->
  <rect x="30" y="115" width="1740" height="440" rx="18" fill="#f7faff" stroke="#d5dfec" stroke-width="2"/>
  <text x="52" y="146" class="section">CONTROL + UART STREAM PLANE</text>
  <rect x="30" y="585" width="1740" height="575" rx="18" fill="#fbfcfe" stroke="#d5dfec" stroke-width="2"/>
  <text x="52" y="616" class="section">SHARED MEMORY DATA PLANE</text>

  <!-- Clock/reset -->
  <rect x="750" y="105" width="260" height="70" class="box" fill="#eef2f7"/>
  <text x="880" y="136" text-anchor="middle" class="block-title">Clock / Reset</text>
  <text x="880" y="160" text-anchor="middle" class="small">clk_i, rst_ni</text>
  <path d="M750 140 H170 V210" class="clock"/>
  <path d="M880 175 V210" class="clock"/>
  <path d="M1010 140 H1480 V210" class="clock"/>
  <path d="M880 175 V660" class="clock"/>

  <!-- CPU -->
  <rect x="70" y="235" width="250" height="175" class="box" fill="#e6f4ec"/>
  <text x="195" y="282" text-anchor="middle" class="block-title">PicoRV32 CPU</text>
  <text x="195" y="315" text-anchor="middle" class="block-text">RV32I firmware</text>
  <text x="195" y="345" text-anchor="middle" class="small">Fetch lệnh, load/store</text>
  <text x="195" y="370" text-anchor="middle" class="small">Cấu hình DMA, IOMMU, UART</text>

  <!-- AXI-Lite router -->
  <rect x="420" y="225" width="250" height="195" class="box" fill="#fff4d8"/>
  <text x="545" y="272" text-anchor="middle" class="block-title">AXI4-Lite</text>
  <text x="545" y="302" text-anchor="middle" class="block-title">Address Router</text>
  <text x="545" y="340" text-anchor="middle" class="block-text">Giải mã địa chỉ</text>
  <text x="545" y="370" text-anchor="middle" class="small">RAM / DMA-IOMMU / UART</text>

  <!-- DMA + IOMMU IP -->
  <rect x="820" y="205" width="340" height="300" class="box" fill="#f1edff"/>
  <text x="990" y="250" text-anchor="middle" class="block-title">DMA + IOMMU IP</text>
  <text x="990" y="282" text-anchor="middle" class="small">AXI4-Lite Control/Status Registers</text>
  <text x="990" y="311" text-anchor="middle" class="small">Descriptor FIFO: 8 entries</text>
  <text x="990" y="340" text-anchor="middle" class="small">DMA: M2M / S2M / M2S</text>
  <text x="990" y="369" text-anchor="middle" class="small">Burst / Cycle-Stealing / Transparent</text>
  <line x1="850" y1="390" x2="1130" y2="390" stroke="#9b8fd3" stroke-width="1.5"/>
  <text x="990" y="421" text-anchor="middle" class="small">DMA-side IOMMU nằm trong IP</text>
  <text x="990" y="450" text-anchor="middle" class="small">IOVA → PA • quyền R/W • range • fault</text>
  <text x="990" y="479" text-anchor="middle" class="small">TLB 4 entries • Page Table 16 entries</text>

  <!-- UART -->
  <rect x="1370" y="235" width="270" height="220" class="box" fill="#e6f7f0"/>
  <text x="1505" y="282" text-anchor="middle" class="block-title">UART Controller</text>
  <text x="1505" y="318" text-anchor="middle" class="small">AXI4-Lite registers</text>
  <text x="1505" y="347" text-anchor="middle" class="small">AXI-Stream endpoint</text>
  <text x="1505" y="386" text-anchor="middle" class="small">RX stream → DMA</text>
  <text x="1505" y="415" text-anchor="middle" class="small">DMA stream → TX</text>

  <!-- CPU <-> Router -->
  <path d="M320 310 H420" class="lite" marker-start="url(#arrowLite)" marker-end="url(#arrowLite)"/>
  <text x="370" y="270" text-anchor="middle" class="bus-label">AXI4-Lite Master</text>
  <text x="370" y="292" text-anchor="middle" class="small">lệnh / load-store / MMIO</text>

  <!-- Router <-> DMA registers -->
  <path d="M670 295 H820" class="lite" marker-start="url(#arrowLite)" marker-end="url(#arrowLite)"/>
  <text x="745" y="252" text-anchor="middle" class="bus-label">AXI4-Lite</text>
  <text x="745" y="274" text-anchor="middle" class="small">cấu hình DMA/IOMMU</text>
  <text x="745" y="320" text-anchor="middle" class="small">0x1000_0000</text>

  <!-- Router <-> UART registers, routed independently -->
  <path d="M545 225 V185 H1505 V235" class="lite" marker-start="url(#arrowLite)" marker-end="url(#arrowLite)"/>
  <text x="1210" y="166" text-anchor="middle" class="bus-label">AXI4-Lite - cấu hình / trạng thái UART</text>
  <text x="1505" y="207" text-anchor="middle" class="small">0x2000_0000</text>

  <!-- UART AXI streams: exactly two independent one-way paths -->
  <path d="M1370 330 H1160" class="stream-rx" marker-end="url(#arrowRx)"/>
  <text x="1265" y="296" text-anchor="middle" class="bus-label" fill="#0c7b5a">AXI-Stream RX → S_AXIS</text>
  <text x="1265" y="318" text-anchor="middle" class="small">UART → DMA (S2M)</text>
  <path d="M1160 405 H1370" class="stream-tx" marker-end="url(#arrowTx)"/>
  <text x="1265" y="439" text-anchor="middle" class="bus-label" fill="#075f96">AXI-Stream M_AXIS → TX</text>
  <text x="1265" y="461" text-anchor="middle" class="small">DMA → UART (M2S)</text>

  <!-- External UART pins -->
  <path d="M1740 305 H1640" class="stream-rx" marker-end="url(#arrowRx)"/>
  <text x="1690" y="285" text-anchor="middle" class="bus-label">UART_RX</text>
  <path d="M1640 390 H1740" class="stream-tx" marker-end="url(#arrowTx)"/>
  <text x="1690" y="423" text-anchor="middle" class="bus-label">UART_TX</text>

  <!-- Sideband: CPU idle and IRQs -->
  <path d="M670 385 H790 Q805 385 805 400 V460 H820" class="side" marker-end="url(#arrowSide)"/>
  <text x="735" y="438" text-anchor="middle" class="small">cpu_bus_idle</text>
  <text x="735" y="459" text-anchor="middle" class="small">Transparent mode</text>
  <path d="M820 225 H780 V155 H195 V235" class="side" marker-end="url(#arrowSide)"/>
  <rect x="350" y="137" width="180" height="28" rx="6" fill="#f7faff"/>
  <text x="440" y="157" text-anchor="middle" class="small">DMA IRQ → CPU</text>
  <path d="M1505 455 V535 H195 V410" class="side" marker-end="url(#arrowSide)"/>
  <rect x="1290" y="516" width="180" height="30" rx="6" fill="#f7faff"/>
  <text x="1380" y="537" text-anchor="middle" class="small">UART IRQ → CPU</text>

  <!-- System AXI Full crossbar -->
  <rect x="385" y="690" width="900" height="150" class="box" fill="#e9f0ff"/>
  <text x="835" y="735" text-anchor="middle" class="block-title">System AXI4-Full Crossbar</text>
  <text x="835" y="767" text-anchor="middle" class="block-text">2 master-side inputs → 1 memory slave</text>
  <text x="835" y="800" text-anchor="middle" class="small">Arbitration CPU/DMA • 5 kênh AW, W, B, AR, R</text>
  <text x="555" y="716" text-anchor="middle" class="port">S0: CPU</text>
  <text x="1050" y="716" text-anchor="middle" class="port">S1: DMA</text>

  <!-- Router CPU RAM branch <-> crossbar S0 -->
  <path d="M545 420 V690" class="full" marker-start="url(#arrowFull)" marker-end="url(#arrowFull)"/>
  <rect x="335" y="495" width="405" height="105" rx="10" fill="#ffffff" stroke="#d4dceb"/>
  <text x="537" y="525" text-anchor="middle" class="bus-label">CPU RAM branch - đọc và ghi</text>
  <text x="537" y="552" text-anchor="middle" class="small">AXI4-Lite single-beat → AXI4-Full S0</text>
  <text x="537" y="578" text-anchor="middle" class="small">ARLEN/AWLEN = 0 • data 32-bit</text>

  <!-- DMA M_AXI <-> crossbar S1 -->
  <path d="M1050 505 V690" class="full" marker-start="url(#arrowFull)" marker-end="url(#arrowFull)"/>
  <rect x="885" y="545" width="330" height="82" rx="10" fill="#ffffff" stroke="#d4dceb"/>
  <text x="1050" y="575" text-anchor="middle" class="bus-label">DMA M_AXI - AXI4-Full</text>
  <text x="1050" y="603" text-anchor="middle" class="small">burst dữ liệu • read/write RAM</text>

  <!-- Memory controller and BRAM -->
  <path d="M835 840 V915" class="full" marker-start="url(#arrowFull)" marker-end="url(#arrowFull)"/>
  <text x="1015" y="884" text-anchor="middle" class="bus-label">M_AXI → S_AXI - AXI4-Full</text>
  <rect x="615" y="915" width="440" height="92" class="box" fill="#fff3d8"/>
  <text x="835" y="953" text-anchor="middle" class="block-title">AXI RAM Controller</text>
  <text x="835" y="982" text-anchor="middle" class="small">AXI4-Full slave interface (axi_ram)</text>
  <path d="M835 1007 V1060" stroke="#59697e" stroke-width="5" marker-start="url(#arrowSide)" marker-end="url(#arrowSide)"/>
  <text x="970" y="1042" class="small">Local memory interface</text>
  <rect x="615" y="1060" width="440" height="100" class="box" fill="#fdeced"/>
  <text x="835" y="1099" text-anchor="middle" class="block-title">Internal BRAM</text>
  <text x="835" y="1129" text-anchor="middle" class="block-text">64 KiB • data width 32-bit</text>
  <text x="835" y="1151" text-anchor="middle" class="small">soc_demo.hex + dữ liệu chương trình</text>

  <!-- Legend -->
  <rect x="1285" y="875" width="455" height="255" rx="16" fill="#ffffff" stroke="#aebbd0" stroke-width="2"/>
  <text x="1512" y="912" text-anchor="middle" class="block-title">CHÚ THÍCH</text>
  <line x1="1320" y1="950" x2="1400" y2="950" class="lite"/>
  <text x="1425" y="957" class="block-text">AXI4-Lite: điều khiển, một beat</text>
  <line x1="1320" y1="995" x2="1400" y2="995" class="full"/>
  <text x="1425" y="1002" class="block-text">AXI4-Full: dữ liệu RAM, burst</text>
  <line x1="1320" y1="1040" x2="1400" y2="1040" class="stream-rx"/>
  <text x="1425" y="1047" class="block-text">AXI-Stream: payload UART</text>
  <line x1="1320" y1="1085" x2="1400" y2="1085" class="side"/>
  <text x="1425" y="1092" class="block-text">IRQ / tín hiệu phụ</text>

  <!-- Key architectural notes -->
  <rect x="1110" y="650" width="620" height="160" rx="14" fill="#fff" stroke="#c8d2e2" stroke-width="2"/>
  <text x="1140" y="686" class="block-title">Điểm cần nhớ</text>
  <text x="1140" y="718" class="block-text">• CPU truy cập RAM bằng giao dịch một beat qua cổng S0.</text>
  <text x="1140" y="750" class="block-text">• DMA là AXI4-Full burst master tại cổng S1.</text>
  <text x="1140" y="782" class="block-text">• Payload UART ↔ DMA đi riêng bằng AXI-Stream, không qua crossbar RAM.</text>
</svg>
